// HL2:DM Advanced Server Configuration
// Created: 1/6/2026, 2:20:06 PM

// --- 1. Identity & Access ---
hostname "|CelMod| Build/RPish - Testing Server"
rcon_password ""
sv_password ""
sv_lan 0
sv_region 255
sv_tags "hl2dm,sandbox,celmod,build,roleplay,fun"

// --- 2. Gameplay Rules ---
mp_teamplay 1
mp_timelimit 60
mp_fraglimit 0
mp_weaponstay 0
mp_falldamage 0
mp_flashlight 1
mp_footsteps 1
sv_hl2mp_weapon_respawn_time 1
sv_hl2mp_item_respawn_time 1
sv_infinite_aux_power 1

// --- 3. Physics & Movement ---
sv_gravity 500
sv_airaccelerate 150
sv_friction 4
sv_stopspeed 100
phys_pushscale 5
sv_turbophysics 0

// --- 4. Performance & Network ---
sv_maxrate 0
sv_minrate 100000
sv_maxupdaterate 100
sv_minupdaterate 66
sv_maxcmdrate 100
sv_mincmdrate 66
net_maxfilesize 64

// --- 5. Communication & Security ---
sv_voiceenable 1
sv_alltalk 1
sv_pure 0
sv_allowupload 1
sv_allowdownload 1
sv_downloadurl "https://raw.githubusercontent.com/rockzehh/celmod-archive/refs/heads/main/fastdl/"

// --- Bans & Execs ---
exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip
log on